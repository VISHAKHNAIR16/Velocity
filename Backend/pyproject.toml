[project]
name = "velocity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<6.0",
    "django-cloudinary-storage>=0.3.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # errors, unused code, import order, likely bugs, modern syntax
ignore = ["E501"]                    # line length is handled by the formatter
