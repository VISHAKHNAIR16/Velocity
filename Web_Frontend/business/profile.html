<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business profile | Velocity</title>
  <link rel="stylesheet" href="/shared/css/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/js/tailwind-config.js"></script>
</head>
<body class="min-h-screen">
  <header id="nav" class="bg-navy"></header>

  <main class="mx-auto max-w-3xl px-4 py-10">
    <h1 class="text-2xl font-bold">Business profile</h1>
    <p class="mt-1 text-sm text-muted">These details appear on your invoices.</p>

    <div id="setup-banner" class="mt-4 hidden rounded border border-amber-300 bg-amber-50 p-4 text-sm text-amber-800">
      Add your address and state to start invoicing. The state decides whether CGST+SGST or IGST is charged.
    </div>

    <form id="profile-form" class="mt-6 space-y-8" novalidate>
      <p data-form-message class="hidden"></p>

            <section class="card">
        <h2 class="font-semibold">Logo</h2>
        <div class="mt-3 flex items-center gap-5">
          <div class="flex h-24 w-24 items-center justify-center overflow-hidden rounded-lg border border-dashed border-slate-300 bg-slate-50">
            <img id="logo-preview" alt="Business logo" class="hidden h-full w-full object-contain" />
            <span id="logo-placeholder" class="text-xs text-muted">No logo</span>
          </div>
          <div>
            <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />
            <button type="button" id="logo-choose" class="btn btn-outline">Upload logo</button>
            <button type="button" id="logo-remove" class="ml-2 hidden text-sm text-muted underline">Remove</button>
            <p class="hint">PNG, JPG or WebP, up to 2 MB.</p>
            <p id="logo-message" class="mt-1 text-sm"></p>
          </div>
        </div>
      </section>

      <div id="sections" class="space-y-8"></div>

      <button type="submit" class="btn btn-primary">Save &amp; Update</button>
    </form>
  </main>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script src="/business/logo.js"></script>
  <script src="/business/profile.js"></script>
</body>
</html>
