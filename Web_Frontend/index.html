<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Velocity | GST Billing</title>
  <link rel="stylesheet" href="/shared/css/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/js/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-navy">
  <main class="mx-auto max-w-xl px-4 py-16">
    <h1 class="text-4xl font-bold text-white">Velocity</h1>
    <div class="speed-bar mt-3 w-24 rounded"></div>
    <p class="mt-4 text-white/70">GST billing, inventory and accounting for growing businesses.</p>

    <div class="mt-6 flex gap-3">
      <a href="/auth/login.html" class="btn btn-primary">Log in</a>
      <a href="/auth/register.html" class="btn border border-glow text-glow">Create account</a>
    </div>

    <section class="card mt-10">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-muted">System status</h2>
      <ul class="mt-3 divide-y divide-slate-200">
        <li class="flex items-center justify-between py-3">
          <span>Frontend (Vercel)</span>
          <span class="text-sm font-medium text-green-600">Online</span>
        </li>
        <li class="flex items-center justify-between py-3">
          <span>Backend (Render)</span>
          <span id="status-backend" class="text-sm font-medium text-muted">Checking...</span>
        </li>
        <li class="flex items-center justify-between py-3">
          <span>Database (Neon)</span>
          <span id="status-database" class="text-sm font-medium text-muted">Checking...</span>
        </li>
      </ul>
      <p id="wake-note" class="mt-3 hidden text-sm text-amber-600">
        The free backend may be waking up. This can take up to a minute.
      </p>
    </section>
  </main>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/api.js"></script>
  <script>
    /** Update a status label. textContent only (XSS-safe). */
    function setStatus(id, ok, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "text-sm font-medium " + (ok ? "text-green-600" : "text-red-600");
    }

    async function checkSystem() {
      const note = document.getElementById("wake-note");
      const timer = setTimeout(() => note.classList.remove("hidden"), 3000);
      try {
        await apiRequest("/health/", { auth: false });
        setStatus("status-backend", true, "Online");
      } catch {
        setStatus("status-backend", false, "Unreachable (check CORS and URL)");
        setStatus("status-database", false, "Not checked");
        clearTimeout(timer);
        return;
      }
      try {
        await apiRequest("/health/db/", { auth: false });
        setStatus("status-database", true, "Connected");
      } catch {
        setStatus("status-database", false, "Unavailable");
      }
      clearTimeout(timer);
      note.classList.add("hidden");
    }
    checkSystem();
  </script>
</body>
</html>
