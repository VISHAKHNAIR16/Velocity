<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | Velocity</title>
  <link rel="stylesheet" href="/shared/css/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/js/tailwind-config.js"></script>
</head>
<body class="min-h-screen">
  <header id="nav" class="bg-navy"></header>

  <main class="mx-auto max-w-4xl px-4 py-10">
    <h1 id="welcome" class="text-2xl font-bold">Welcome</h1>
    <p class="mt-1 text-sm text-muted">Here is your business at a glance.</p>

    <div id="setup-banner" class="mt-4 hidden rounded border border-amber-300 bg-amber-50 p-4 text-sm text-amber-800">
      Finish your business setup (address and state) before billing.
      <a href="/business/profile.html" class="font-semibold underline">Complete profile</a>
    </div>

    <div class="mt-8 grid gap-4 sm:grid-cols-2">
      <div class="card text-muted">Parties (coming next)</div>
      <div class="card text-muted">Items (coming soon)</div>
    </div>
  </main>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
