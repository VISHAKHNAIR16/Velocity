<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Party Statement | Velocity</title>
  <link rel="stylesheet" href="/shared/css/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/js/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-page">
  <header id="nav" class="bg-navy"></header>

  <main class="mx-auto max-w-7xl px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-navy">Party Statement</h1>
        <p class="mt-1 text-sm text-muted">Running-balance ledger for one party.</p>
      </div>
      <button id="print-btn" type="button" class="btn btn-ghost w-full sm:w-auto">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print / Save PDF
      </button>
    </div>

    <!-- Party summary -->
    <div id="party-summary" class="card mb-6 p-6 hidden">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h2 id="stmt-party-name" class="text-lg font-semibold text-navy"></h2>
          <p id="stmt-party-type" class="text-sm text-muted"></p>
        </div>
        <div class="text-right">
          <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">Opening Balance</div>
          <div class="mt-1 text-lg font-bold text-navy" id="stmt-opening"></div>
        </div>
        <div class="text-right">
          <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Billed</div>
          <div class="mt-1 text-lg font-bold text-navy" id="stmt-billed">₹0.00</div>
        </div>
        <div class="text-right">
          <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Paid</div>
          <div class="mt-1 text-lg font-bold text-navy" id="stmt-paid">₹0.00</div>
        </div>
        <div class="text-right">
          <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">Pending Balance</div>
          <div class="mt-1 text-2xl font-bold text-navy" id="stmt-pending">₹0.00</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="card mb-6 p-4">
      <div class="flex flex-col sm:flex-row gap-4">
        <div class="flex-1 sm:w-48">
          <label class="label" for="stmt-date-from">From Date</label>
          <input id="stmt-date-from" type="date" class="input mt-1" />
        </div>
        <div class="flex-1 sm:w-48">
          <label class="label" for="stmt-date-to">To Date</label>
          <input id="stmt-date-to" type="date" class="input mt-1" />
        </div>
        <button id="stmt-apply-filters" type="button" class="btn btn-primary w-full sm:w-auto">Apply</button>
        <button id="stmt-clear-filters" type="button" class="btn btn-ghost w-full sm:w-auto">Clear</button>
      </div>
    </div>

    <!-- Statement table -->
    <div id="stmt-container" class="rounded border border-slate-200 bg-white hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-4 py-3 font-medium text-slate-600">Date</th>
            <th class="px-4 py-3 font-medium text-slate-600 hidden sm:table-cell">Type</th>
            <th class="px-4 py-3 font-medium text-slate-600 hidden md:table-cell">Reference</th>
            <th class="px-4 py-3 font-medium text-slate-600 text-right">Debit</th>
            <th class="px-4 py-3 font-medium text-slate-600 text-right">Credit</th>
            <th class="px-4 py-3 font-medium text-slate-600 text-right">Balance</th>
          </tr>
        </thead>
        <tbody id="stmt-body" class="divide-y divide-line-soft">
          <!-- Rows injected -->
        </tbody>
        <tfoot>
          <tr class="bg-slate-50 font-semibold">
            <td class="px-4 py-3" colspan="3">Totals</td>
            <td class="px-4 py-3 text-right" id="stmt-total-debit">₹0.00</td>
            <td class="px-4 py-3 text-right" id="stmt-total-credit">₹0.00</td>
            <td class="px-4 py-3 text-right" id="stmt-final-balance">₹0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p id="stmt-empty" class="mt-2 text-sm text-slate-500 hidden">No ledger entries for the selected period.</p>
  </main>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script src="/parties/statement.js"></script>
</body>
</html>
